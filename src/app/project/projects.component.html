<div class="projects-container">
  <div class="project-card" *ngFor="let project of projects">
    <!-- Project Name -->
    <h2>{{ project.name }}</h2>

    <!-- View Details Button -->
    <button (click)="showDetails(project)">
      {{ selectedProject === project ? 'Hide Details' : 'View Details' }}
    </button>

    <!-- Details Section -->
    <div *ngIf="selectedProject === project" class="details">
      <p style="white-space: pre-line;">{{ project.details }}</p>
    </div>
  </div>
</div>
